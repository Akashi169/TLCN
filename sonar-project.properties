# ===================================================================
# SonarQube Scanner Configuration (NEXUS Cloud Cyber OS)
# ===================================================================

# Project Key & Name (Open-Source Community Edition)
sonar.projectKey=nexus-cloud-cyber-os
sonar.projectName=NEXUS Cloud Cyber OS
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx

# Exclusions (Loại trừ node_modules, build artifacts, coverage, static files)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.js,**/*.config.cjs,**/public/**

# Character Encoding
sonar.sourceEncoding=UTF-8

# JavaScript / Node.js Analysis Settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
